<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tidak ditemukan - FORSHA 7</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23071a31'/%3E%3Ctext x='16' y='23' font-size='20' font-family='serif' fill='%23d4af37' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#04070d;--surface:#0a1424;--line:rgba(255,255,255,.10);--text:#f4f5f7;--muted:#93a0b4;--accent:#c9a227}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;display:grid;place-items:center;padding:8vw;background:var(--ink);color:var(--text);font-family:Outfit,system-ui,sans-serif;line-height:1.65}
main{width:min(560px,100%);border:1px solid var(--line);background:var(--surface);padding:clamp(28px,6vw,56px)}
.mark{width:37px;height:37px;display:grid;place-items:center;border:1px solid var(--accent);color:var(--accent);font-size:19px}
h1{margin-top:28px;font-size:clamp(26px,6vw,40px);font-weight:600;letter-spacing:-.02em;text-wrap:balance}
p{margin-top:16px;color:var(--muted);max-width:48ch}
a{display:inline-flex;align-items:center;gap:9px;min-height:44px;margin-top:34px;padding:13px 22px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-size:12px;letter-spacing:.13em;text-transform:uppercase}
a:hover,a:focus-visible{background:var(--accent);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">7</div>
  <h1>Halaman ini tidak ada</h1>
  <p>Alamatnya mungkin salah ketik, atau halaman ini sudah dipindahkan. Daftar lengkapnya ada di halaman utama.</p>
  <a href="/FORSHA7/">Kembali ke FORSHA 7 <span aria-hidden="true">&#8599;</span></a>
</main>
</body>
</html>
